<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 370" width="100%" height="100%">
  <defs>
    <linearGradient id="terminalBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1e38" />
    </linearGradient>
    <linearGradient id="pulseGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .code-text {
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 13.5px;
      line-height: 22px;
    }
    .keyword { fill: #c084fc; font-weight: 600; }
    .class-name { fill: #38bdf8; font-weight: 600; }
    .func { fill: #34d399; font-weight: 600; }
    .variable { fill: #94a3b8; }
    .property { fill: #e2e8f0; }
    .string { fill: #a7f3d0; }
    .number { fill: #f59e0b; }
    .operator { fill: #38bdf8; }
    .comment { fill: #64748b; font-style: italic; }
    
    .cursor {
      fill: #10b981;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .status-dot {
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.5; r: 4px; }
      50% { opacity: 1; r: 5px; }
    }
    .border-glow {
      animation: borderShift 4s linear infinite alternate;
    }
    @keyframes borderShift {
      0% { stroke-opacity: 0.4; }
      100% { stroke-opacity: 0.9; }
    }
  </style>

  <!-- Background Card -->
  <rect x="5" y="5" width="810" height="360" rx="16" fill="#080b11" />
  
  <!-- Glowing Animated Border -->
  <rect class="border-glow" x="5" y="5" width="810" height="360" rx="16" fill="none" stroke="url(#terminalBorder)" stroke-width="1.8" />

  <!-- Terminal Header -->
  <path d="M 5 21 A 16 16 0 0 1 21 5 L 799 5 A 16 16 0 0 1 815 21 L 815 45 L 5 45 Z" fill="url(#headerGrad)" />
  <line x1="5" y1="45" x2="815" y2="45" stroke="#334155" stroke-opacity="0.4" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="28" cy="25" r="6" fill="#ef4444" />
  <circle cx="48" cy="25" r="6" fill="#f59e0b" />
  <circle cx="68" cy="25" r="6" fill="#10b981" />

  <!-- Header Title -->
  <text x="410" y="29" fill="#94a3b8" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="500" text-anchor="middle">
    anuja@portfolio: ~/profile.py
  </text>

  <!-- Online Badge -->
  <circle class="status-dot" cx="740" cy="25" r="4.5" fill="#10b981" filter="url(#glow)" />
  <text x="752" y="29" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">ONLINE</text>

  <!-- Code Body -->
  <g class="code-text" transform="translate(30, 75)">
    <!-- Line 1 -->
    <text y="0">
      <tspan class="keyword">class</tspan> <tspan class="class-name">SoftwareEngineer</tspan>:
    </text>

    <!-- Line 2 -->
    <text y="26" x="20">
      <tspan class="keyword">def</tspan> <tspan class="func">__init__</tspan>(<tspan class="variable">self</tspan>):
    </text>

    <!-- Line 3 -->
    <text y="52" x="40">
      <tspan class="variable">self</tspan>.<tspan class="property">name</tspan> = <tspan class="string">"Anuja Witharana"</tspan>
    </text>

    <!-- Line 4 -->
    <text y="78" x="40">
      <tspan class="variable">self</tspan>.<tspan class="property">degree</tspan> = <tspan class="string">"B.CompSci (Software Engineering) • Edith Cowan University"</tspan>
    </text>

    <!-- Line 5 -->
    <text y="104" x="40">
      <tspan class="variable">self</tspan>.<tspan class="property">status</tspan> = <tspan class="string">"Computer Science Graduate 🎓 • Sri Lanka 🇱🇰"</tspan>
    </text>

    <!-- Line 6 -->
    <text y="130" x="40">
      <tspan class="variable">self</tspan>.<tspan class="property">core_focus</tspan> = [<tspan class="string">"Full-Stack Web"</tspan>, <tspan class="string">"Backend Engineering"</tspan>, <tspan class="string">"Distributed Systems"</tspan>]
    </text>

    <!-- Line 7 -->
    <text y="156" x="40">
      <tspan class="variable">self</tspan>.<tspan class="property">tech_stack</tspan> = [<tspan class="string">"Python"</tspan>, <tspan class="string">"Next.js"</tspan>, <tspan class="string">"TypeScript"</tspan>, <tspan class="string">"MySQL"</tspan>, <tspan class="string">"PostgreSQL"</tspan>, <tspan class="string">"Docker"</tspan>]
    </text>

    <!-- Line 8 -->
    <text y="186" x="20">
      <tspan class="keyword">def</tspan> <tspan class="func">connect</tspan>(<tspan class="variable">self</tspan>):
    </text>

    <!-- Line 9 -->
    <text y="212" x="40">
      <tspan class="keyword">return</tspan> <tspan class="string">"Let's build something extraordinary together! 🚀"</tspan> <rect class="cursor" x="510" y="198" width="8" height="17" rx="1.5" />
    </text>

    <!-- Line 10 Comment -->
    <text y="246" x="20">
      <tspan class="comment"># Crafting scalable systems, clean APIs &amp; modern web applications</tspan>
    </text>
  </g>
</svg>
